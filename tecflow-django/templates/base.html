{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            TecFlow
        {% endblock %}
    </title>

    <!-- Bootstrap -->
    <link
        rel="stylesheet"
        href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}"
    >

    <!-- CSS do projeto -->
    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">

            <a
                class="navbar-brand"
                href="{% url 'assistencia:dashboard' %}"
            >
                TecFlow
            </a>

        </div>
    </nav>

    <main class="container py-4">

        {% block content %}
        {% endblock %}

    </main>

    <!-- Bootstrap -->
    <script
        src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}">
    </script>

    <!-- JavaScript do projeto -->
    <script
        src="{% static 'js/script.js' %}">
    </script>

</body>

</html>
